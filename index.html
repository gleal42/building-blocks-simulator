<!DOCTYPE html>
<!-- Built by "npm run build" from the files in src/. Edit those, not this file. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Place cube + prism pieces and loose prisms in a tray, turn them every way they can go, and check which black-and-white pictures can be made.">
<title>Building Blocks Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Unbounded:wght@500;700&amp;display=swap">
<style>:root {
  /* Layout: the tray is the hero, lying on a tabletop; the controls sit beside it like a
     parts bin (below it on phones). */
  --table: #e8e2d4;
  --table-deep: #dcd3c0;
  --panel: #f8f5ee;
  --ink: #1c1b18;
  --muted: #696354;
  --line: #d6cdb9;
  --accent: #2b55d4;
  --accent-ink: #ffffff;
  --ok: #1f7a4a;
  --bad: #bf3a2b;
  --warn: #9a6200;
  --weave: rgba(80, 64, 30, 0.05);
  --font-display: "Unbounded", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --table: #23221c;
    --table-deep: #1a1914;
    --panel: #2d2b24;
    --ink: #f1ebde;
    --muted: #b1a891;
    --line: #48432f;
    --accent: #8ba6ff;
    --accent-ink: #10131d;
    --ok: #63c891;
    --bad: #ff8371;
    --warn: #f2b552;
    --weave: rgba(255, 240, 200, 0.035);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --table: #23221c;
  --table-deep: #1a1914;
  --panel: #2d2b24;
  --ink: #f1ebde;
  --muted: #b1a891;
  --line: #48432f;
  --accent: #8ba6ff;
  --accent-ink: #10131d;
  --ok: #63c891;
  --bad: #ff8371;
  --warn: #f2b552;
  --weave: rgba(255, 240, 200, 0.035);
  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  background-color: var(--table);
  background-image:
    repeating-linear-gradient(45deg, var(--weave) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(-45deg, var(--weave) 0 1px, transparent 1px 6px);
  color: var(--ink);
  font: 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
}

button,
input {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 14px 16px 28px;
}

/* ---- Header ---------------------------------------------------------------------------- */

.top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.brand h1 span {
  font-weight: 500;
  color: var(--muted);
}

.tabs {
  display: flex;
  gap: 2px;
  padding: 4px;
  border-radius: 14px;
  background: var(--table-deep);
}

.tabs button {
  border: 0;
  border-radius: 10px;
  padding: 8px 14px;
  background: transparent;
  color: var(--muted);
  font-weight: 600;
  font-size: 14px;
  white-space: nowrap;
}

.tabs button[aria-selected="true"] {
  background: var(--panel);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
  /* The active tab carries the puzzle's own motif: a corner split into black and white. */
  background-image: linear-gradient(135deg, transparent 82%, var(--ink) 82%);
}

/* ---- Layout ---------------------------------------------------------------------------- */

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

@media (min-width: 920px) {
  .layout {
    grid-template-columns: minmax(0, 1.3fr) minmax(330px, 0.85fr);
    align-items: start;
  }

  .stage {
    position: sticky;
    top: 12px;
  }
}

.stage {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

.board-wrap {
  border-radius: 18px;
}

.board-wrap svg {
  display: block;
  width: 100%;
  height: auto;
  max-height: min(70vh, 780px);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: crosshair;
  border-radius: 18px;
}

.board-wrap svg.is-pickup {
  cursor: grab;
}

.board-wrap svg.is-3d {
  cursor: default;
}

body[data-mode="check"] .board-wrap svg {
  cursor: cell;
}

.status {
  min-height: 2.9em;
  margin: 0;
  padding: 0 4px;
  color: var(--muted);
  font-size: 14px;
}

.status[data-tone="bad"] {
  color: var(--bad);
}

.status[data-tone="ok"] {
  color: var(--ok);
  font-weight: 600;
}

.stage-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
}

.tools {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tool {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--panel);
  font-size: 14px;
  font-weight: 500;
}

.tool:hover:not(:disabled) {
  border-color: var(--muted);
}

.tool[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

.tool:disabled {
  opacity: 0.4;
  cursor: default;
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  margin: 0;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.stats b {
  color: var(--ink);
  font-family: var(--font-display);
  font-weight: 500;
}

.target-mini {
  display: flex;
  align-items: center;
  gap: 10px;
}

.target-mini svg {
  width: auto;
  height: 56px;
  border-radius: 4px;
}

.target-mini p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

/* ---- Panel ----------------------------------------------------------------------------- */

.panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

.card {
  padding: 14px 16px 16px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
}

.card h2 {
  margin: 0 0 12px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}

.muted {
  color: var(--muted);
}

.hint {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 13px;
}

kbd {
  display: inline-block;
  min-width: 1.6em;
  padding: 0 4px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  font: 600 12px/1.5 var(--font-body);
  text-align: center;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: transparent;
  font-weight: 600;
  font-size: 14px;
}

.btn:hover:not(:disabled) {
  border-color: var(--muted);
}

.btn.primary {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
}

.btn.wide {
  width: 100%;
}

.btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.row-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  font-size: 13px;
  font-weight: 500;
}

.chip svg {
  width: 16px;
  height: 16px;
}

.chip.is-on {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--panel);
}

/* Parts bin: compartments in the colour of the tray. */
.bin {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.bin-slot {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 74px;
  padding: 6px 10px 6px 6px;
  border: 2px solid transparent;
  border-radius: 13px;
  background: linear-gradient(180deg, #d2b67e, #e3cb96 30%, #e8d3a3);
  box-shadow: inset 0 2px 5px rgba(80, 55, 15, 0.35);
  color: #2a2418;
  text-align: left;
}

.bin-slot.is-selected {
  border-color: var(--accent);
  box-shadow: inset 0 2px 5px rgba(80, 55, 15, 0.35), 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
}

.bin-slot.is-empty .bin-icon {
  opacity: 0.4;
}

.bin-icon {
  display: grid;
  place-items: center;
  width: 70px;
  flex: none;
}

.bin-icon svg {
  max-width: 70px;
  height: auto;
}

.bin-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.bin-name {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
}

.swatch {
  display: inline-block;
  width: 11px;
  height: 11px;
  border-radius: 3px;
  border: 1px solid rgba(0, 0, 0, 0.45);
}

.swatch.W {
  background: #fafaf7;
}

.swatch.B {
  background: #1d1f22;
}

.bin-count {
  font-size: 13px;
  color: #5a4f38;
  font-variant-numeric: tabular-nums;
}

.bin-count b {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: #2a2418;
}

/* Rotation picker */
.orient-grid {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.orient-head,
.orient-row {
  display: grid;
  grid-template-columns: minmax(64px, 1fr) repeat(4, minmax(46px, 62px));
  align-items: center;
  gap: 4px;
}

.orient-grid.tri .orient-row {
  grid-template-columns: minmax(64px, 1fr) repeat(4, minmax(42px, 56px));
}

.orient-head span {
  text-align: center;
  color: var(--muted);
  font-size: 16px;
}

.orient-label {
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.2;
}

.orient {
  display: grid;
  place-items: center;
  min-height: 46px;
  padding: 2px;
  border: 1.5px solid transparent;
  border-radius: 10px;
  background: color-mix(in srgb, var(--table) 70%, transparent);
}

.orient svg {
  width: 100%;
  max-width: 54px;
  height: auto;
}

.orient:hover {
  border-color: var(--line);
}

.orient.is-on {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 14%, var(--panel));
}

.orient-now {
  margin: 10px 0 0;
  font-weight: 600;
  font-size: 14px;
}

.turn-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.icon-floor {
  fill: rgba(120, 92, 40, 0.2);
}

/* Tray size */
.size-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 10px 14px;
}

.stepper {
  display: grid;
  grid-template-columns: 38px 40px 38px;
  grid-template-rows: auto 38px;
  align-items: center;
}

.stepper-label {
  grid-column: 1 / -1;
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 12.5px;
}

.stepper button {
  height: 38px;
  border: 1px solid var(--line);
  background: transparent;
  font-size: 18px;
}

.stepper button:first-of-type {
  border-radius: 10px 0 0 10px;
}

.stepper button:last-of-type {
  border-radius: 0 10px 10px 0;
}

.stepper button:disabled {
  opacity: 0.35;
}

.stepper output {
  display: grid;
  place-items: center;
  height: 38px;
  border-block: 1px solid var(--line);
  font-family: var(--font-display);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.size-note {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.size-note.is-bad {
  color: var(--bad);
}

.share {
  margin-top: 14px;
  border-top: 1px solid var(--line);
  padding-top: 10px;
}

.share summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 600;
}

.code-row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.code-row input {
  flex: 1;
  min-width: 0;
  height: 42px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--table);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 13px;
}

/* Paint palette */
.palette {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 6px;
}

.swatch-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 46px;
  padding: 6px 8px;
  border: 1.5px solid var(--line);
  border-radius: 11px;
  background: transparent;
  text-align: left;
  font-size: 12.5px;
  line-height: 1.2;
}

.swatch-btn svg {
  width: 28px;
  height: 28px;
  flex: none;
  border-radius: 4px;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
}

.swatch-btn.is-on {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, var(--panel));
}

/* Flat pictures */
.fp-w {
  fill: #f6f6f2;
}

.fp-b {
  fill: #1d1f22;
}

.fp-any {
  fill: #cdb27c;
  opacity: 0.55;
}

.fp-miss {
  fill: none;
  stroke: var(--bad);
  stroke-width: 1.6;
}

.flat-picture {
  background: #b89c63;
  border-radius: 6px;
}

.target {
  display: flex;
  justify-content: center;
  padding: 10px;
  border-radius: 12px;
  background: linear-gradient(180deg, #d2b67e, #e8d3a3);
}

.target svg {
  width: 100%;
  max-width: 260px;
  height: auto;
  max-height: 300px;
}

.win {
  margin: 10px 0 0;
  color: var(--ok);
  font-weight: 600;
}

/* Result of a check */
.result {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  margin-top: 12px;
}

.result p {
  flex: 1 1 220px;
  margin: 0;
}

.pill {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: #fff;
}

.pill.ok {
  background: var(--ok);
}

.pill.bad {
  background: var(--bad);
}

.pill.warn {
  background: var(--warn);
}

:root[data-theme="dark"] .pill,
.pill {
  color: var(--panel);
}

.spinner {
  width: 20px;
  height: 20px;
  border: 3px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

/* ---- Board details --------------------------------------------------------------------- */

.ghost-body {
  opacity: 0.55;
}

.ghost-line {
  fill: none;
  stroke: var(--accent);
  stroke-width: 4;
}

.ghost.is-bad .ghost-line {
  stroke: var(--bad);
  stroke-dasharray: 10 7;
}

.ghost.is-bad .ghost-body {
  opacity: 0.3;
}

.piece.is-hover {
  filter: drop-shadow(0 0 5px var(--accent)) drop-shadow(0 0 2px var(--accent));
}

.piece.is-glass {
  opacity: 0.38;
}

.glass-line {
  fill: none;
  stroke: #1c1b18;
  stroke-width: 2.5;
  stroke-dasharray: 8 6;
}

.hollow-mark {
  fill: none;
  stroke: #bf3a2b;
  stroke-width: 3;
  stroke-dasharray: 8 6;
  opacity: 0.75;
}

.paint-hover {
  fill: none;
  stroke: var(--accent);
  stroke-width: 5;
}

.any-cell {
  opacity: 0.8;
}

.piece.is-fresh {
  transform-box: fill-box;
  transform-origin: center;
  animation: drop 0.18s ease-out;
}

.board-wrap.is-shake {
  animation: shake 0.28s ease-in-out;
}

.board-wrap.is-win {
  animation: win 1.2s ease-out;
}

/* ---- Footer and dialog ----------------------------------------------------------------- */

.foot {
  margin-top: 22px;
  max-width: 68ch;
  color: var(--muted);
  font-size: 13px;
}

.foot p {
  margin: 0;
}

.modal {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(20, 18, 12, 0.5);
}

.modal[hidden] {
  display: none;
}

.modal-card {
  width: min(420px, 100%);
  padding: 20px;
  border-radius: 16px;
  background: var(--panel);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
}

.modal-text {
  margin: 0 0 16px;
  font-size: 15.5px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes drop {
  from {
    transform: scale(1.06);
    opacity: 0.6;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes shake {
  25% {
    transform: translateX(-5px);
  }
  50% {
    transform: translateX(4px);
  }
  75% {
    transform: translateX(-2px);
  }
}

@keyframes win {
  0% {
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 70%, transparent);
  }
  100% {
    box-shadow: 0 0 0 26px transparent;
  }
}

@media (prefers-reduced-motion: reduce) {
  .piece.is-fresh,
  .board-wrap.is-shake,
  .board-wrap.is-win {
    animation: none;
  }

  .spinner {
    animation-duration: 2s;
  }
}

@media (max-width: 520px) {
  .app {
    padding-inline: 12px;
  }

  .brand h1 {
    font-size: 16px;
  }

  .tabs {
    width: 100%;
  }

  .tabs button {
    flex: 1;
    padding: 8px 6px;
    font-size: 13px;
  }

  .tool {
    padding: 0 10px;
    font-size: 13px;
  }

  .tools .tool[data-action="undo"] span,
  .tools .tool[data-action="redo"] span,
  .tools .tool[data-action^="turn-view"] span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }

  .target-mini svg {
    height: 72px;
  }

  .bin {
    grid-template-columns: 1fr 1fr;
  }

  .bin-icon {
    width: 56px;
  }

  .bin-icon svg {
    max-width: 56px;
  }

  .orient-head,
  .orient-row {
    grid-template-columns: 58px repeat(4, minmax(0, 1fr));
  }

  .orient-grid.tri .orient-row {
    grid-template-columns: 58px repeat(4, minmax(0, 1fr));
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">
        <rect x="1" y="1" width="38" height="38" rx="8" fill="#e6cf9b" stroke="#b49a63"/>
        <rect x="6" y="6" width="13" height="13" rx="2" fill="#f7f7f4"/>

    return new Promise((resolve) => {
      pendingCheck = { id, resolve, args };
      w.postMessage({ id, rows, cols, looks, inventory, maxNodes: CHECK_BUDGET });
    });
  }
  async function checkPicture() {
    const looks = state.pattern.slice();
    const key = looks.join(",");
    state.check = { status: "running", key };
    render();
    const res = await runSolver(state.rows, state.cols, looks, state.build.inventory);
    if (state.check.status !== "running" || state.check.key !== key) return;
    state.check = { ...res, key };
    render();
    const words = { possible: "Possible.", impossible: "Impossible.", unknown: "Could not decide." };
    setStatus(`${words[res.status]} ${res.status === "possible" ? "Press “Build it on the tray” to see how." : res.reason ?? ""}`, true, res.status === "possible" ? "ok" : "bad");
  }
  function cancelCheck() {
    if (worker) worker.terminate();
    worker = null;
    pendingCheck = null;
    state.check = { status: "idle" };
    render();
    setStatus("Check cancelled.");
  }
  function patternChanged() {
    if (state.check.status !== "idle" && state.check.status !== "running") state.check = { status: "idle" };
  }
  function paintCell(index) {
    if (index < 0 || state.pattern[index] === state.paint) return;
    state.pattern = state.pattern.slice();
    state.pattern[index] = state.paint;
    patternChanged();
    render();
  }
  function showSolution() {
    if (state.check.status !== "possible") return;
    state.buildHistory.record(state.build);
    state.build = loadPieces(state.check.pieces, state.rows, state.cols);
    state.mode = "build";
    state.view = "top";
    render();
    setStatus("Here is one way to build the picture. Turn on X-ray to see the pieces hidden under roofs.");
  }
  function samplePicture(id) {
    const sample = SAMPLES.find((s) => s.id === id);
    const looks = sample?.make(state.rows, state.cols);
    if (!looks) return;
    state.pattern = looks.slice();
    patternChanged();
    render();
  }
  function pictureFromBuild() {
    state.pattern = state.build.looks().map((l) => l < 0 ? LOOK.ANY : l);
    patternChanged();
    render();
    setStatus("Copied the Build tray. Squares that are not full became “Any”.");
  }
  function randomPicture() {
    const pieces = randomArrangement(state.rows, state.cols, state.build.inventory, makeRng(Date.now() >>> 0), 0.55);
    state.pattern = loadPieces(pieces, state.rows, state.cols).looks();
    patternChanged();
    render();
    setStatus("A random picture that the pieces can make.");
  }
  function clearPicture() {
    state.pattern = new Array(state.rows * state.cols).fill(LOOK.ANY);
    patternChanged();
    render();
  }
  function newChallenge() {
    const ch = state.challenge;
    const rng = makeRng((Date.now() ^ Math.random() * 1e9) >>> 0);
    let best = null;
    const wantSplit = { easy: 0.08, medium: 0.25, hard: 0.42 }[ch.difficulty] * state.rows * state.cols;
    for (let k = 0; k < 8; k += 1) {
      const pieces = randomArrangement(state.rows, state.cols, ch.board.inventory, rng, DIFFICULTY[ch.difficulty]);
      const looks = loadPieces(pieces, state.rows, state.cols).looks();
      const split = looks.filter((l) => l >= 3).length;
      const score = Math.abs(split - wantSplit);
      if (!best || score < best.score) best = { pieces, looks, score };
    }
    state.challenge = { ...freshChallenge(state.rows, state.cols, ch.difficulty), target: best.looks, answer: best.pieces };
    render();
    setStatus("New challenge: fill the tray so it shows the picture.");
  }
  function challengeProgress() {
    const { board, target } = state.challenge;
    const looks = board.looks();
    let match = 0;
    const mismatch = looks.map((l, i) => {
      const ok = l >= 0 && (target[i] === LOOK.ANY || l === target[i]);
      if (ok) match += 1;
      return l >= 0 && !ok;
    });
    return { match, total: looks.length, mismatch };
  }
  function afterChallengeMove() {
    const ch = state.challenge;
    if (!ch.target || ch.solved) return;
    const prog = challengeProgress();
    if (prog.match === prog.total && ch.board.isComplete()) {
      ch.solved = true;
      setTimeout(() => setStatus(`Solved in ${ch.moves} moves!`, true, "ok"), 0);
      celebrate();
    }
  }
  function celebrate() {
    const wrap = $("#boardWrap");
    wrap.classList.remove("is-win");
    void wrap.offsetWidth;
    wrap.classList.add("is-win");
  }
  async function revealAnswer() {
    const ch = state.challenge;
    if (!ch.answer) return;
    if (!ch.solved && !await confirmDialog("Show the answer? Your pieces in the tray will be replaced.", "Show answer")) return;
    ch.history.record(ch.board);
    ch.board = loadPieces(ch.answer, state.rows, state.cols);
    ch.revealed = true;
    ch.solved = true;
    render();
    setStatus("This is the arrangement the picture was made from. Other arrangements can make it too.");
  }
  function restartChallenge() {
    const ch = state.challenge;
    ch.history.record(ch.board);
    ch.board = new Board(state.rows, state.cols);
    ch.moves = 0;
    ch.solved = false;
    ch.revealed = false;
    render();
  }
  function confirmDialog(message2, okLabel) {
    const modal = $("#modal");
    modal.querySelector(".modal-text").textContent = message2;
    const ok = modal.querySelector('[data-answer="yes"]');
    ok.textContent = okLabel;
    modal.hidden = false;
    const previous = document.activeElement;
    ok.focus();
    return new Promise((resolve) => {
      const finish = (answer) => {
        modal.hidden = true;
        modal.removeEventListener("click", onClick2);
        document.removeEventListener("keydown", onKey, true);
        previous?.focus?.({ preventScroll: true });
        resolve(answer);
      };
      const onClick2 = (e) => {
        const btn = e.target.closest("[data-answer]");
        if (btn) finish(btn.dataset.answer === "yes");
        else if (e.target === modal) finish(false);
      };
      const onKey = (e) => {
        if (e.key === "Escape") {
          e.stopPropagation();
          finish(false);
        }
      };
      modal.addEventListener("click", onClick2);
      document.addEventListener("keydown", onKey, true);
    });
  }
  function svgPoint(evt) {
    const svg2 = $("#board");
    const m = svg2.getScreenCTM();
    if (!m) return null;
    const pt = new DOMPoint(evt.clientX, evt.clientY).matrixTransform(m.inverse());
    return pt;
  }
  function hoverFromEvent(evt) {
    const p = svgPoint(evt);
    if (!p) return null;
    return cellFromPoint(state.rows, state.cols, p.x, p.y);
  }
  function sameHover(a, b) {
    if (!a || !b) return a === b;
    if (a.r !== b.r || a.c !== b.c) return false;
    if (state.tool !== "pickup") return true;
    return activeBoard().pieceAt(a.r, a.c, a.fx, a.fy) === activeBoard().pieceAt(b.r, b.c, b.fx, b.fy);
  }
  function onPointerMove(evt) {
    if (!pointer.down) pointer.type = evt.pointerType;
    if (state.mode !== "check" && state.view === "3d") return;
    const h = hoverFromEvent(evt);
    if (state.mode === "check") {
      const index = h ? h.r * state.cols + h.c : -1;
      if (pointer.down && index >= 0) {
        paintCell(index);
      }
      if (index !== state.hoverCell) {
        state.hoverCell = index;
        renderBoard();
      }
      return;
    }
    if (!pointer.down && evt.pointerType !== "mouse") return;
    if (!sameHover(h, state.hover)) {
      state.hover = h;
      renderBoard();
    } else if (h) {
      state.hover = h;
    }
  }
  function onPointerDown(evt) {
    if (evt.button !== 0) return;
    if (state.mode !== "check" && state.view === "3d") {
      setStatus("Switch to the top view to place or pick up pieces.", true);
      return;
    }
    const svg2 = $("#board");
    svg2.setPointerCapture?.(evt.pointerId);
    pointer.down = true;
    pointer.id = evt.pointerId;
    pointer.type = evt.pointerType;
    const h = hoverFromEvent(evt);
    if (state.mode === "check") {
      if (h) paintCell(h.r * state.cols + h.c);
      return;
    }
    state.hover = h;
    renderBoard();
    evt.preventDefault();
  }
  function onPointerUp(evt) {
    if (!pointer.down || evt.pointerId !== pointer.id) return;
    pointer.down = false;
    if (state.mode === "check") return;
    const h = hoverFromEvent(evt) ?? null;
    if (h) {
      state.hover = h;
      if (state.tool === "pickup") pickUpAt(h);
      else if (state.selected) placeAt(h);
      else pickUpAt(h);
    }
    if (evt.pointerType !== "mouse") {
      state.hover = null;
      renderBoard();
    }
  }
  function onPointerLeave() {
    if (pointer.down) return;
    if (state.hover || state.hoverCell >= 0) {
      state.hover = null;
      state.hoverCell = -1;
      renderBoard();
    }
  }
  function onContextMenu(evt) {
    if (state.mode === "check" || state.view === "3d") return;
    evt.preventDefault();
    if (pointer.type !== "mouse") return;
    const h = hoverFromEvent(evt);
    if (h) pickUpAt(h);
  }
  function moveCursor(dr, dc) {
    const h = state.hover ?? { r: 0, c: 0, fx: 0.5, fy: 0.5 };
    const r = Math.max(0, Math.min(state.rows - 1, h.r + dr));
    const c = Math.max(0, Math.min(state.cols - 1, h.c + dc));
    if (state.mode === "check") {
      state.hoverCell = r * state.cols + c;
      state.hover = { r, c, fx: 0.5, fy: 0.5 };
    } else {
      state.hover = { r, c, fx: 0.5, fy: 0.5 };
    }
    renderBoard();
  }
  function onBoardKey(evt) {
    const keys = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    if (keys[evt.key]) {
      evt.preventDefault();
      moveCursor(...keys[evt.key]);
      return;
    }
    if (evt.key === "Enter" || evt.key === " ") {
      evt.preventDefault();
      if (!state.hover) {
        moveCursor(0, 0);
        return;
      }
      if (state.mode === "check") paintCell(state.hover.r * state.cols + state.hover.c);
      else if (state.view !== "3d") {
        if (state.tool === "pickup" || !state.selected) pickUpAt(state.hover);
        else placeAt(state.hover);
      }
    } else if ((evt.key === "Delete" || evt.key === "Backspace") && state.hover && state.mode !== "check") {
      evt.preventDefault();
      pickUpAt(state.hover);
    }
  }
  function onGlobalKey(evt) {
    if (!$("#modal").hidden) return;
    if (evt.target.closest?.("input, textarea, select")) return;
    const key = evt.key.toLowerCase();
    if ((evt.ctrlKey || evt.metaKey) && key === "z") {
      evt.preventDefault();
      if (evt.shiftKey) redo();
      else undo();
      return;
    }
    if ((evt.ctrlKey || evt.metaKey) && key === "y") {
      evt.preventDefault();
      redo();
      return;
    }
    if (evt.ctrlKey || evt.metaKey || evt.altKey) return;
    if (state.mode === "check") return;
    if (key === "r") turn();
    else if (key === "f") flip();
    else if (key === "t") tip();
    else if (["1", "2", "3", "4"].includes(key)) {
      state.selected = KINDS[Number(key) - 1];
      state.tool = "place";
      render();
    } else if (key === "p") toggleTool();
    else if (key === "x") {
      state.xray = !state.xray;
      render();
    } else if (key === "v") toggleView();
    else if (key === "escape") {
      state.hover = null;
      renderBoard();
    }
  }
  function toggleTool() {
    state.tool = state.tool === "pickup" ? "place" : "pickup";
    resetStatus();
    render();
  }
  function toggleView() {
    state.view = state.view === "3d" ? "top" : "3d";
    state.hover = null;
    resetStatus();
    render();
  }
  var ACTIONS = {
    select: (el) => {
      state.selected = el.dataset.kind;
      state.tool = "place";
      resetStatus();
      render();
    },
    orient: (el) => {
      const type = KIND_INFO[state.selected].type;
      state.orient[type] = Number(el.dataset.o);
      state.tool = "place";
      resetStatus();
      render();
    },
    turn,
    flip,
    tip,
    undo,
    redo,
    pickup: toggleTool,
    xray: () => {
      state.xray = !state.xray;
      render();
    },
    view: toggleView,
    "turn-view-left": () => {
      state.azimuth = (state.azimuth + 90) % 360;
      render();
    },
    "turn-view-right": () => {
      state.azimuth = (state.azimuth + 270) % 360;
      render();
    },
    "size-inc": (el) => {
      state.sizeDraft = { ...state.sizeDraft, [el.dataset.key]: Math.min(MAX_SIZE, state.sizeDraft[el.dataset.key] + 1) };
      renderPanel();
    },
    "size-dec": (el) => {
      state.sizeDraft = { ...state.sizeDraft, [el.dataset.key]: Math.max(1, state.sizeDraft[el.dataset.key] - 1) };
      renderPanel();
    },
    "apply-size": () => setSize(state.sizeDraft.rows, state.sizeDraft.cols),
    "quick-size": (el) => {
      const rows = Number(el.dataset.rows);
      const cols = Number(el.dataset.cols);
      if (rows === state.rows && cols === state.cols) return;
      setSize(rows, cols);
    },
    preset: (el) => usePreset(el.dataset.id),
    "random-fill": randomFill,
    "clear-board": clearBoard,
    "copy-code": copyCode,
    "load-code": loadCode,
    paint: (el) => {
      state.paint = Number(el.dataset.look);
      renderPanel();
    },
    sample: (el) => samplePicture(el.dataset.id),
    "from-build": pictureFromBuild,
    "random-picture": randomPicture,
    "clear-picture": clearPicture,
    check: checkPicture,
    "cancel-check": cancelCheck,
    "show-solution": showSolution,
    difficulty: (el) => {
      state.challenge.difficulty = el.dataset.level;
      newChallenge();
    },
    "new-challenge": newChallenge,
    "restart-challenge": restartChallenge,
    reveal: revealAnswer
  };
  function onClick(evt) {
    const tab = evt.target.closest("[data-tab]");
    if (tab) {
      setMode(tab.dataset.tab);
      return;
    }
    const el = evt.target.closest("[data-action]");
    if (!el || el.disabled) return;
    const action = ACTIONS[el.dataset.action];
    if (action) action(el);
  }
  function onTabKey(evt) {
    const tabs = [...document.querySelectorAll("[data-tab]")];
    const i = tabs.indexOf(evt.target);
    if (i < 0) return;
    let next = -1;
    if (evt.key === "ArrowRight") next = (i + 1) % tabs.length;
    if (evt.key === "ArrowLeft") next = (i - 1 + tabs.length) % tabs.length;
    if (next >= 0) {
      evt.preventDefault();
      setMode(tabs[next].dataset.tab);
      tabs[next].focus();
    }
  }
  function start(hotData) {
    let saved = null;
    if (hotData && hotData.v === 1) saved = hotData;
    else {
      try {
        saved = JSON.parse(localStorage.getItem(STORAGE_KEY) ?? "null");
      } catch {
        saved = null;
      }
    }
    state = restore(saved);
    window.claude?.hot?.snapshot?.(() => snapshot());
    const svg2 = $("#board");
    svg2.addEventListener("pointermove", onPointerMove);
    svg2.addEventListener("pointerdown", onPointerDown);
    svg2.addEventListener("pointerup", onPointerUp);
    svg2.addEventListener("pointercancel", () => {
      pointer.down = false;
      state.hover = null;
      renderBoard();
    });
    svg2.addEventListener("pointerleave", onPointerLeave);
    svg2.addEventListener("contextmenu", onContextMenu);
    svg2.addEventListener("keydown", onBoardKey);
    svg2.addEventListener("blur", () => {
      if (state.hover && pointer.type !== "mouse") {
        state.hover = null;
        renderBoard();
      }
    });
    document.addEventListener("click", onClick);
    document.addEventListener("keydown", onGlobalKey);
    document.querySelector(".tabs").addEventListener("keydown", onTabKey);
    $("#panel").addEventListener("keydown", (evt) => {
      if (evt.key === "Enter" && evt.target.id === "codeIn") loadCode();
    });
    render();
  }

  // src/main.js
  function boot() {
    const hot = window.claude?.hot;
    if (hot?.ready) hot.ready(start);
    else start(hot?.data ?? {});
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
