<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Notan: make packs of black-and-white designs for the block puzzle, print their cards, box and rules, and preview what a buyer gets.">
<title>Notan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Unbounded:wght@500;700&amp;display=swap">
<style>/*__CSS__*/</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">
        <rect x="1" y="1" width="38" height="38" rx="8" fill="#e6cf9b" stroke="#b49a63"/>
        <rect x="6" y="6" width="13" height="13" rx="2" fill="#f7f7f4"/>
        <path d="M21 6h13v13Z" fill="#1d1f22"/><path d="M21 6v13h13Z" fill="#f7f7f4"/>
        <path d="M6 21h13v13Z" fill="#f7f7f4"/><path d="M6 21v13h13Z" fill="#1d1f22"/>
        <rect x="21" y="21" width="13" height="13" rx="2" fill="#1d1f22"/>
      </svg>
      <h1>Notan</h1>
      <div class="side-switch" role="group" aria-label="Whose side">
        <button type="button" data-side="maker" aria-pressed="true">Maker</button>
        <button type="button" data-side="customer" aria-pressed="false">Customer</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Maker"></nav>
  </header>
  <div class="side-note" id="sideNote" hidden></div>
  <main class="layout">
    <section class="stage" aria-label="Tray">
      <div id="stageTop"></div>
      <div class="board-wrap" id="boardWrap">
        <div class="view-turn" id="viewTurn" hidden>
          <span class="view-turn-label">Rotate the view</span>
          <button type="button" data-action="view-left" title="Rotate the view to the left" aria-label="Rotate the view to the left"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2.3 5.7"/><path d="M4 4v7h7"/></svg></button>
          <button type="button" data-action="view-reset" title="Look from the front">Front</button>
          <button type="button" data-action="view-right" title="Rotate the view to the right" aria-label="Rotate the view to the right"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
        </div>
        <svg id="board" role="application" tabindex="0" aria-label="Tray" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="print-stage" id="printStage" hidden></div>
      <div class="photo-stage" id="photoStage" hidden></div>
      <div class="play-stage" id="playStage" hidden></div>
      <div class="library-stage" id="libraryStage" hidden></div>
      <p class="status" id="status" aria-live="polite"></p>
      <div class="stage-bar" id="stageBar"></div>
    </section>
    <aside class="panel" id="panel" aria-label="Controls"></aside>
  </main>
  <footer class="foot">
    <p>Every 2 squares of a tray come with one cube + prism and one loose prism; half the pieces are white, half black. A cube always shows as a full square, so at most half the squares can show a split.</p>
  </footer>
</div>
<input type="file" id="filePicker" hidden>
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalText">
    <p class="modal-text" id="modalText"></p>
    <div class="modal-actions">
      <button type="button" class="btn" data-answer="no">Cancel</button>
      <button type="button" class="btn primary" data-answer="yes">OK</button>
    </div>
  </div>
</div>
<script>/*__JS__*/</script>
</body>
</html>
